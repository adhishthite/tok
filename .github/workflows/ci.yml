name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install build tools
        timeout-minutes: 5
        run: |
          brew install xcodegen actionlint uv
          make install
      - name: Validate workflow tooling
        run: make check-ci
      - name: Check
        timeout-minutes: 6
        env:
          TOK_BUILD_TIMEOUT_SECONDS: 300
        run: python3 Scripts/bounded_run.py --seconds 300 --label ci-check -- make check
      - name: Package development build
        timeout-minutes: 3
        run: python3 Scripts/bounded_run.py --seconds 120 --label ci-package -- make package
      - name: Upload development artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Tok-development-${{ github.sha }}
          path: build/package/Tok.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Tok-test-results-${{ github.sha }}
          path: build/DerivedData/Logs/Test/*.xcresult
          retention-days: 14
