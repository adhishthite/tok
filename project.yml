name: Tok
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: '14.0'
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_DEBUG_DYLIB: NO
    MARKETING_VERSION: '0.1.3'
    CURRENT_PROJECT_VERSION: '10'
    TOK_UPDATE_FEED_URL: 'https://github.com/adhishthite/tok-releases/releases/latest/download/appcast.xml'
    TOK_SOURCE_REVISION: unversioned
targets:
  TokSettingsReference:
    type: tool
    platform: macOS
    sources: Tools/SettingsReference.swift
    dependencies:
      - target: TokEngine
      - sdk: libsqlite3.tbd
  TokEngine:
    type: library.static
    platform: macOS
    sources: Sources/Engine
    settings:
      base:
        SWIFT_VERSION: '5.0'
        SWIFT_STRICT_CONCURRENCY: minimal
        DEFINES_MODULE: YES
        PRODUCT_MODULE_NAME: TokEngine
  TokHUD:
    type: library.static
    platform: macOS
    sources: Sources/HUD
    dependencies:
      - target: TokEngine
    settings:
      base:
        SWIFT_VERSION: '5.0'
        SWIFT_STRICT_CONCURRENCY: minimal
        DEFINES_MODULE: YES
  Tok:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - Sources/UI
      - Sources/Store
      - Sources/Support
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: TokEngine
      - target: TokHUD
      - package: Sparkle
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adhishthite.tok
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/Tok.entitlements
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  TokTests:
    type: bundle.unit-test
    platform: macOS
    sources: Tests/AppTests
    dependencies:
      - target: Tok
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adhishthite.tok.tests
        GENERATE_INFOPLIST_FILE: YES
  TokHUDTests:
    type: bundle.unit-test
    platform: macOS
    sources: Tests/HUDTests
    dependencies:
      - target: Tok
      - target: TokHUD
    settings:
      base:
        SWIFT_VERSION: '5.0'
        SWIFT_STRICT_CONCURRENCY: minimal
        PRODUCT_BUNDLE_IDENTIFIER: com.adhishthite.tok.hud-tests
        GENERATE_INFOPLIST_FILE: YES
  TokEngineTests:
    type: bundle.unit-test
    platform: macOS
    sources: Tests/EngineTests
    dependencies:
      - target: TokEngine
      - sdk: libsqlite3.tbd
    settings:
      base:
        SWIFT_VERSION: '5.0'
        SWIFT_STRICT_CONCURRENCY: minimal
        PRODUCT_BUNDLE_IDENTIFIER: com.adhishthite.tok.engine-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TokSettingsReference:
    build:
      targets:
        TokSettingsReference: all
  TokLiveChecks:
    build:
      targets:
        TokEngine: all
    test:
      targets:
        - TokEngineTests
      environmentVariables:
        TOK_LIVE_TESTS: '1'
        TOK_PROJECT_ROOT: $(SRCROOT)
  Tok:
    build:
      targets:
        Tok: all
    test:
      gatherCoverageData: true
      targets:
        - TokTests
        - TokEngineTests
        - TokHUDTests
